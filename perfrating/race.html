<section class="race lists-only" id="race" aria-labelledby="race-title" hidden>
  <div class="race-head">
    <div>
      <h2 id="race-title">How the race unfolded</h2>
      <div class="race-sub" id="race-sub"></div>
      <div class="race-key" aria-hidden="true"><span><i class="sq"></i>FIDE rating</span><span><i class="sq solid"></i>TPR</span></div>
    </div>
    <div class="race-month" id="race-month" aria-hidden="true"></div>
  </div>
  <div class="race-ctl">
    <button type="button" class="race-play" id="race-play">Play</button>
    <div class="race-track">
      <input type="range" id="race-seek" min="0" max="0" value="0" aria-label="Month">
      <div class="race-ticks" id="race-ticks" aria-hidden="true"></div>
    </div>
  </div>
  <div class="race-plot" id="race-plot"><span class="race-unit" aria-hidden="true">Rating</span><div class="race-axis" id="race-axis"></div><p class="race-empty" id="race-empty" hidden>No one has enough games yet.</p><div class="tip" id="race-tip" hidden></div></div>
</section>
