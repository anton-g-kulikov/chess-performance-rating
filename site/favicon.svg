<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30">
<!-- Three games as the site draws them: a win stands tall in green, a draw half as tall
     and hatched, a loss points down from the same line. -->
<style>.w{fill:#1d6a47}.i{fill:#141a16}.l{stroke:#141a16;stroke-width:.5}.d{fill:url(#h);stroke:#141a16;stroke-width:.5}@media (prefers-color-scheme:dark){.w{fill:#62c493}.i{fill:#e5ebe7}.l,.d{stroke:#e5ebe7}}</style>
<defs><pattern id="h" width="1.5" height="1.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="l" x1="0" y1="0" x2="0" y2="1.5"/></pattern></defs>
<rect class="w" x="2" y="1" width="6" height="16"/>
<rect class="d" x="12.25" y="9.25" width="5.5" height="7.5"/>
<rect class="i" x="22" y="17" width="6" height="12"/>
</svg>
