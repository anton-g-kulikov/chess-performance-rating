<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30">
<!-- A corner of the board that is also a rising chart. -->
<style>.i{fill:#141a16}.p{fill:#fbfcfa;stroke:#141a16;stroke-width:1.5}.a{fill:#1d6a47}@media (prefers-color-scheme:dark){.i{fill:#e5ebe7}.p{fill:#0f1411;stroke:#e5ebe7}.a{fill:#62c493}}</style>
<rect class="i" x="0" y="20" width="10" height="10"/>
<rect class="p" x="10.75" y="20.75" width="8.5" height="8.5"/>
<rect class="i" x="10" y="10" width="10" height="10"/>
<rect class="i" x="20" y="20" width="10" height="10"/>
<rect class="p" x="20.75" y="10.75" width="8.5" height="8.5"/>
<rect class="a" x="20" y="0" width="10" height="10"/>
</svg>
